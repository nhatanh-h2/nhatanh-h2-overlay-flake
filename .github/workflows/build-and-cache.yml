name: build-and-cache

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-latest
          - system: x86_64-linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v15
        with:
          name: nhatanh-h2
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build every shell for this system
        run: |
          attrs=$(nix eval --json ".#devShells.${{ matrix.system }}" --apply builtins.attrNames)
          for name in $(echo "$attrs" | jq -r '.[]'); do
            echo "::group::Building $name"
            nix build ".#devShells.${{ matrix.system }}.$name" -L
            echo "::endgroup::"
          done
