name: build-and-cache

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
      CACHIX_SIGNING_KEY:
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-latest
          - system: x86_64-linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    environment: Build
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nhatanh-h2
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"

      - name: Attic
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://attic.toneriko.top/
          cache: h2
          token: ${{ secrets.ATTIC_TONERIKO_TOKEN }}

      - name: Build devshells
        run: |
          shells=("goShell" "rustShells.stable" "rustShells.nightly")
          echo "::group::Building"
          nix build -j 8 --cores 0 --accept-flake-config "${shells[@]/#/.#devShells.${{ matrix.system }}.}" -L
          echo "::endgroup::"
